/* ============================================================
   DESIGN TOKENS + SIGNATURE STYLES  ("Civic Ledger" theme)
   ============================================================ */
const GlobalStyle = () => (
  <style>{`
    @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

    [data-sae-theme="light"] {
      --sae-ink: #16213E;
      --sae-ink-soft: #4A5178;
      --sae-paper: #EFF1EA;
      --sae-paper-raised: #FFFFFF;
      --sae-border: #D9D8C9;
      --sae-ochre: #A9761F;
      --sae-ochre-soft: #EFDDB5;
      --sae-green: #2F6F4E;
      --sae-green-soft: #DCEBE1;
      --sae-red: #AE3B2E;
      --sae-red-soft: #F3DEDA;
      --sae-shadow: 0 1px 2px rgba(22,33,62,0.06), 0 4px 14px rgba(22,33,62,0.06);
    }
    [data-sae-theme="dark"] {
      --sae-ink: #ECE9DE;
      --sae-ink-soft: #A9AFC9;
      --sae-paper: #12172A;
      --sae-paper-raised: #1B2238;
      --sae-border: #2C3454;
      --sae-ochre: #D8A64B;
      --sae-ochre-soft: #3B301A;
      --sae-green: #59AD82;
      --sae-green-soft: #1C3327;
      --sae-red: #E27564;
      --sae-red-soft: #3A2320;
      --sae-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }

    .sae-root { background: var(--sae-paper); color: var(--sae-ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; min-height: 100%; transition: background 0.2s ease, color 0.2s ease; }
    /* BUG FIX: <button> elements get a browser-default text color (often black)
       that does NOT inherit from the parent like normal text does. Without this,
       any button using only card/card-action styling for text (no explicit
       color) stayed dark in dark mode, making it unreadable. Low-specificity
       fallback — any button class below that sets its own color still wins. */
    button { color: inherit; font-family: inherit; }
    .sae-display { font-family: 'Zilla Slab', serif; }
    .sae-mono { font-family: 'IBM Plex Mono', monospace; }

    .sae-header { background: var(--sae-paper-raised); border-bottom: 1px solid var(--sae-border); position: sticky; top: 0; z-index: 30; }
    .sae-seal-mark { width: 38px; height: 38px; border-radius: 9999px; border: 2px solid var(--sae-ochre); display: flex; align-items: center; justify-content: center; color: var(--sae-ochre); font-weight: 700; font-size: 14px; transform: rotate(-6deg); flex-shrink: 0; }

    .sae-icon-btn { border: 1px solid var(--sae-border); background: var(--sae-paper-raised); color: var(--sae-ink); border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .sae-icon-btn:hover { border-color: var(--sae-ochre); color: var(--sae-ochre); }

    .sae-sidebar { background: var(--sae-paper-raised); border-right: 1px solid var(--sae-border); }
    .sae-nav-item { color: var(--sae-ink-soft); border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
    .sae-nav-item:hover { background: var(--sae-paper); color: var(--sae-ink); }
    .sae-nav-item.active { background: var(--sae-ochre-soft); color: var(--sae-ink); border-color: var(--sae-ochre); font-weight: 600; }

    .sae-card { background: var(--sae-paper-raised); border: 1px solid var(--sae-border); border-radius: 16px; box-shadow: var(--sae-shadow); }
    .sae-card-action { cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; }
    .sae-card-action:hover { transform: translateY(-2px); border-color: var(--sae-ochre); }
    .sae-card-action:focus-visible { outline: 2px solid var(--sae-ochre); outline-offset: 2px; }

    .sae-btn-primary { background: var(--sae-ink); color: var(--sae-paper); border-radius: 9999px; font-weight: 600; border: 1px solid var(--sae-ink); cursor: pointer; }
    .sae-btn-primary:hover { background: var(--sae-ochre); border-color: var(--sae-ochre); color: var(--sae-ink); }
    .sae-btn-ghost { background: transparent; color: var(--sae-ink); border-radius: 9999px; border: 1px solid var(--sae-border); cursor: pointer; font-weight: 500; }
    .sae-btn-ghost:hover { border-color: var(--sae-ochre); color: var(--sae-ochre); }
    .sae-chip { border-radius: 9999px; border: 1px solid var(--sae-border); background: var(--sae-paper-raised); color: var(--sae-ink-soft); font-size: 12px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
    .sae-chip.active { border-color: var(--sae-ochre); color: var(--sae-ink); background: var(--sae-ochre-soft); font-weight: 600; }

    .sae-progress-track { background: var(--sae-border); border-radius: 9999px; overflow: hidden; }
    .sae-progress-fill { background: var(--sae-ochre); height: 100%; border-radius: 9999px; transition: width 0.4s ease; }

    .sae-stamp { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--sae-ink-soft); color: var(--sae-ink-soft); border-radius: 9999px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; }
    .sae-stamp.ready { border-color: var(--sae-green); color: var(--sae-green); }
    .sae-stamp.progress { border-color: var(--sae-ochre); color: var(--sae-ochre); }
    .sae-stamp.weak { border-color: var(--sae-red); color: var(--sae-red); }

    .sae-input { background: var(--sae-paper-raised); border: 1px solid var(--sae-border); border-radius: 12px; color: var(--sae-ink); padding: 9px 12px 9px 34px; font-size: 13.5px; width: 100%; }
    .sae-input:focus { outline: none; border-color: var(--sae-ochre); }

    .sae-bottom-nav { background: var(--sae-paper-raised); border-top: 1px solid var(--sae-border); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; }
    .sae-bottom-item { color: var(--sae-ink-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .sae-bottom-item.active { color: var(--sae-ochre); }

    .sae-drawer-backdrop { position: fixed; inset: 0; background: rgba(15,18,30,0.5); z-index: 40; }
    .sae-drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 78%; max-width: 320px; background: var(--sae-paper-raised); z-index: 41; border-left: 1px solid var(--sae-border); overflow-y: auto; }

    .sae-matrix-table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
    .sae-matrix-table th, .sae-matrix-table td { border: 1px solid var(--sae-border); padding: 6px 8px; text-align: center; white-space: nowrap; }
    .sae-matrix-table th { background: var(--sae-paper); color: var(--sae-ink-soft); font-weight: 600; position: sticky; top: 0; }
    .sae-matrix-table td:first-child, .sae-matrix-table th:first-child { text-align: left; position: sticky; left: 0; background: var(--sae-paper-raised); }

    @media (prefers-reduced-motion: reduce) { .sae-card-action, .sae-progress-fill, .sae-root { transition: none !important; } }

    /* ===== Developer Reveal Sequence ===== */
    @keyframes devrev-matrix-fall { from { transform: translateY(0); } to { transform: translateY(230%); } }
    @keyframes devrev-scan-sweep { from { top: -2%; } to { top: 102%; } }
    @keyframes devrev-cursor-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes devrev-glitch {
      0% { transform: translate(0,0); text-shadow: 0 0 14px #4ADE80; }
      20% { transform: translate(-3px,2px); text-shadow: -2px 0 #ff3355, 2px 0 #22e0ff; }
      40% { transform: translate(3px,-2px); text-shadow: 2px 0 #ff3355, -2px 0 #22e0ff; }
      60% { transform: translate(-2px,1px); text-shadow: -2px 0 #ff3355, 2px 0 #22e0ff; }
      80% { transform: translate(2px,-1px); text-shadow: 2px 0 #ff3355, -2px 0 #22e0ff; }
      100% { transform: translate(0,0); text-shadow: 0 0 18px #4ADE80; }
    }

/* ============================================================
   PERSISTENCE HELPERS (window.storage, personal scope only)
   ============================================================ */
async function storageGet(key, fallback) {
  try { const res = await window.storage.get(key, false); return res ? JSON.parse(res.value) : fallback; }
  catch { return fallback; }
}
async function storageSet(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), false); } catch { /* best-effort */ }
}

/* ============================================================
   DEVELOPER REVEAL SEQUENCE
   Vanilla DOM + Web Audio (no external files) — a full-screen
   "hacker terminal" intro (Phase 1) → typewriter welcome
   (Phase 2) → cinematic profile entrance with warm chimes
   (Phase 3, handled inside AboutView). Kept as plain functions
   outside React since it's imperative DOM/audio choreography,
   not component state.
   ============================================================ */
function getAudioCtx() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    return new Ctx();
  } catch { return null; }
}

// --- Phase 1 sounds: harsh/synthetic ---
function devrevHum(ctx) {
  if (!ctx) return { stop() {} };
  try {
    const osc = ctx.createOscillator();
    const filt = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    osc.type = "sawtooth"; osc.frequency.value = 70;
    filt.type = "lowpass"; filt.frequency.value = 220;
    gain.gain.value = 0;
    osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 0.4);
    return {
      stop() {
        try {
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
          osc.stop(ctx.currentTime + 0.35);
        } catch { /* noop */ }
      },
    };
  } catch { return { stop() {} }; }
}
function devrevBeep(ctx) {
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square"; osc.frequency.value = 620 + Math.random() * 260;
    gain.gain.value = 0.05;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    osc.stop(ctx.currentTime + 0.07);
  } catch { /* noop */ }
}
function devrevTypingClick(ctx) {
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square"; osc.frequency.value = 1200 + Math.random() * 400;
    gain.gain.value = 0.035;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.03);
    osc.stop(ctx.currentTime + 0.035);
  } catch { /* noop */ }
}
function devrevGlitchSound(ctx) {
  if (!ctx) return;
  try {
    const bufSize = Math.floor(ctx.sampleRate * 0.15);
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 1800;
    const gain = ctx.createGain(); gain.gain.value = 0.11;
    src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    src.start();
    [660, 990].forEach((freq, i) => {
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq; g.gain.value = 0.06;
      osc.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.09;
      osc.start(t);
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.stop(t + 0.1);
    });
  } catch { /* noop */ }
}
// --- Phase 3 sounds: warm/cinematic ---
function devrevSwell(ctx) {
  if (!ctx) return;
  try {
    [[220, 440], [330, 554]].forEach(([f1, f2]) => {
      const osc = ctx.createOscillator(); const filt = ctx.createBiquadFilter(); const gain = ctx.createGain();
      osc.type = "sine"; filt.type = "lowpass"; filt.frequency.value = 1200;
      osc.frequency.setValueAtTime(f1, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(f2, ctx.currentTime + 1);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.5);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.05);
      osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 1.1);
    });
  } catch { /* noop */ }
}
function devrevChime(ctx, freq = 660, gainPeak = 0.07) {
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(gainPeak, ctx.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.62);
  } catch { /* noop */ }
}

let _devrevInProgress = false;
const DEVREV_MATRIX_CHARS = "01" + "アカサタナハマヤラワイキシチニヒミリヲウクスツヌフムユルエケセテネヘメレオコソトノホモヨロン";

function runDeveloperRevealSequence(onComplete) {
  if (_devrevInProgress) return; // re-entry guard
  _devrevInProgress = true;

  const ctx = getAudioCtx();
  if (ctx && ctx.state === "suspended") { try { ctx.resume(); } catch { /* noop */ } }

  // BUG FIX: browsers only allow <audio>.play() when it happens right in
  // response to a user gesture. Our narration clip was being created and
  // played ~11s into the sequence (deep inside a nested setTimeout), long
  // after that gesture had expired — so play() was silently rejected and
  // nothing was ever heard. Create + "prime" the audio element right here,
  // synchronously, in direct response to the click; a real HTMLAudioElement
  // that has successfully played once stays unlocked for later .play()
  // calls on most browsers, so we reuse this same instance in the
  // narration phase below instead of creating a fresh one there.
  // BUG FIX #2: the priming trick above still relies on HTMLMediaElement's
  // own autoplay policy, which is separate from (and often stricter than —
  // especially inside a sandboxed iframe like Claude's artifact preview)
  // the Web Audio API's policy. Since ctx (Web Audio) is already reliably
  // producing sound elsewhere in this sequence (the hum/beeps), decode the
  // narration clip into an AudioBuffer and play it through that SAME
  // AudioContext instead of a separate <audio> element — one consistent,
  // already-proven-working audio pathway instead of two different ones.
  let narrationBuffer = null;
  if (ctx) {
    try {
      const base64 = DEVELOPER_NARRATION_AUDIO.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const decodeResult = ctx.decodeAudioData(
        bytes.buffer,
        (buf) => { narrationBuffer = buf; },
        () => { narrationBuffer = null; }
      );
      if (decodeResult && typeof decodeResult.then === "function") {
        decodeResult.then((buf) => { narrationBuffer = buf; }).catch(() => { narrationBuffer = null; });
      }
    } catch { narrationBuffer = null; }
  }

  const overlay = document.createElement("div");
  overlay.className = "devrev-overlay";

  const colCount = 22;
  for (let i = 0; i < colCount; i++) {
    const col = document.createElement("div");
    col.className = "devrev-col";
    col.style.left = `${(i / colCount) * 100}%`;
    col.style.animationDuration = `${2 + Math.random() * 2}s`;
    col.style.animationDelay = `${Math.random() * -3}s`;
    let text = "";
    const len = 16 + Math.floor(Math.random() * 10);
    for (let j = 0; j < len; j++) text += DEVREV_MATRIX_CHARS[Math.floor(Math.random() * DEVREV_MATRIX_CHARS.length)] + "\n";
    col.textContent = text;
    overlay.appendChild(col);
  }
  const scan = document.createElement("div"); scan.className = "devrev-scanline"; overlay.appendChild(scan);
  const crt = document.createElement("div"); crt.className = "devrev-crt"; overlay.appendChild(crt);
  const terminal = document.createElement("div"); terminal.className = "devrev-terminal"; overlay.appendChild(terminal);

  document.body.appendChild(overlay);
  const hum = devrevHum(ctx);

  const addLine = (text, extraClass) => {
    const prevCursor = terminal.querySelector(".devrev-cursor");
    if (prevCursor) prevCursor.classList.remove("devrev-cursor");
    const line = document.createElement("div");
    line.className = "devrev-cursor" + (extraClass ? " " + extraClass : "");
    line.textContent = text;
    terminal.appendChild(line);
    return line;
  };

  const lines = [
    "> INITIATING SECURE ACCESS PROTOCOL...",
    "> SCANNING IDENTITY SIGNATURE...",
    "> DECRYPTING DEVELOPER PROFILE...",
  ];
  const lineTimes = [150, 900, 1650];
  lineTimes.forEach((t, i) => setTimeout(() => { addLine(lines[i]); devrevBeep(ctx); }, t));

  setTimeout(() => {
    const prevCursor = terminal.querySelector(".devrev-cursor");
    if (prevCursor) prevCursor.classList.remove("devrev-cursor");
    const granted = document.createElement("div");
    granted.className = "devrev-granted";
    granted.textContent = "> ACCESS GRANTED";
    terminal.appendChild(granted);
    devrevGlitchSound(ctx);
  }, 2250);

  // Phase 2 — typewriter welcome line
  const welcomeText = "Welcome To Developer Profile";
  const typeStart = 2250 + 850;
  setTimeout(() => {
    const welcomeLine = document.createElement("div");
    welcomeLine.className = "devrev-cursor";
    welcomeLine.style.marginTop = "10px";
    terminal.appendChild(welcomeLine);
    let i = 0;
    const typeNext = () => {
      if (i < welcomeText.length) {
        welcomeLine.textContent = welcomeText.slice(0, i + 1);
        if (welcomeText[i] !== " ") devrevTypingClick(ctx);
        i += 1;
        setTimeout(typeNext, 45);
      } else {
        setTimeout(playNarrationPhase, 550);
      }
    };
    typeNext();
  }, typeStart);

  // New phase — plays the uploaded narration clip while its text types out
  // in sync, then hands off to Phase 3 (photo/name cinematic reveal) once
  // the audio actually finishes (with a safety-timeout fallback in case
  // playback is blocked or unsupported).
  const playNarrationPhase = () => {
    const prevCursor = terminal.querySelector(".devrev-cursor");
    if (prevCursor) prevCursor.classList.remove("devrev-cursor");
    const narrationLine = document.createElement("div");
    narrationLine.className = "devrev-cursor";
    narrationLine.style.marginTop = "10px";
    terminal.appendChild(narrationLine);

    const fallbackDurationMs = 8900; // known clip length; used if playback is blocked/unsupported/still decoding
    let handedOff = false;
    const handOff = () => {
      if (handedOff) return;
      handedOff = true;
      setTimeout(finish, 300);
    };

    if (ctx && narrationBuffer) {
      try {
        const source = ctx.createBufferSource();
        source.buffer = narrationBuffer;
        source.connect(ctx.destination);
        source.onended = handOff;
        source.start();
      } catch { /* fallback timer below still fires so the sequence never gets stuck */ }
    }

    const text = DEVELOPER_NARRATION_TEXT;
    const perCharMs = Math.max(18, (fallbackDurationMs - 200) / text.length);
    let i = 0;
    const typeNarration = () => {
      if (i < text.length) {
        narrationLine.textContent = text.slice(0, i + 1);
        if (text[i] !== " ") devrevTypingClick(ctx);
        i += 1;
        setTimeout(typeNarration, perCharMs);
      }
    };
    typeNarration();

    setTimeout(handOff, fallbackDurationMs);
  };

  const finish = () => {
    hum.stop();
    overlay.classList.add("devrev-fadeout");
    setTimeout(() => {
      overlay.remove();
      _devrevInProgress = false;
      onComplete(ctx);
    }, 520);
  };
}

    optionA: options[0], optionB: options[1], optionC: options[2], optionD: options[3],
    correctAnswer, explanation, difficulty, questionType,

}

   Derived entirely from the already fact-checked NOTES and

   introduced here, just repackaged for spaced-recall review.

function topicTitle(unitId, topicId) {
  const unit = SYLLABUS.find((u) => u.id === unitId);
  const topic = unit && unit.topics.find((t) => t.id === topicId);
  return topic ? topic.title : topicId;
}

/* ============================================================
   MOCK TEST SET BUILDER
   Picks n questions proportionally across units (by how many
   questions each unit's pool actually has), so a 72-question
   bank doesn't get skewed toward whichever unit is largest.
   With only 72 questions total, sets drawn back-to-back will
   overlap — the UI says so honestly rather than pretending
   these are 3 fixed, non-overlapping papers.
   ============================================================ */
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function buildTestSet(n) {
  const byUnit = SYLLABUS.map((u) => ({ unit: u.id, pool: MCQ_BANK.filter((q) => q.unit === u.id) }));
  const total = byUnit.reduce((a, u) => a + u.pool.length, 0);
  const capped = Math.min(n, total);
  const raw = byUnit.map((u) => ({ unit: u.unit, poolLen: u.pool.length, exact: (u.pool.length / total) * capped }));
  let allocated = raw.map((r) => ({ ...r, take: Math.min(Math.floor(r.exact), r.poolLen) }));
  let remaining = capped - allocated.reduce((a, r) => a + r.take, 0);
  allocated.sort((a, b) => (b.exact - Math.floor(b.exact)) - (a.exact - Math.floor(a.exact)));
  for (let i = 0; i < allocated.length && remaining > 0; i++) {
    if (allocated[i].take < allocated[i].poolLen) { allocated[i].take += 1; remaining -= 1; }
  }
  const selected = allocated.flatMap((r) => shuffle(byUnit.find((u) => u.unit === r.unit).pool).slice(0, r.take));
  return shuffle(selected);
}

/* ============================================================
   FINAL PREDICTION ENGINE
   Every score component here is visible and computed from real
   data already in the app (syllabus priority, written MCQ count,
   whether a linked activity exists, PYQ-style/important-question
   presence). There is no PYQ frequency evidence to draw on since
   none was found (Phase 5), so priority is syllabus-significance
   based only — exactly as disclosed to the student.
   ============================================================ */
function computeTopicScore(topicId) {
  const note = NOTES[topicId];
  const priority = note ? note.priority : 2;
  const mcqCount = MCQ_BANK.filter((q) => q.mainTopic === topicId).length;
  const hasActivity = SYLLABUS.some((u) => u.activities.some((a) => a.linkedTo === topicId));
  const hasPyq = PYQ_STYLE.some((q) => q.mainTopic === topicId);
  const hasImportantQ = IMPORTANT_QUESTIONS.some((q) => q.mainTopic === topicId);
  const score = priority * 2 + Math.min(mcqCount, 6) + (hasActivity ? 3 : 0) + (hasPyq ? 2 : 0) + (hasImportantQ ? 2 : 0);
  return { score, priority, mcqCount, hasActivity, hasPyq, hasImportantQ };
}

function buildPredictionList() {
  const topics = SYLLABUS.flatMap((u) => u.topics.map((t) => ({ ...t, unit: u.id, unitTitle: u.title })));
  const scored = topics.map((t) => ({ ...t, ...computeTopicScore(t.id) })).sort((a, b) => b.score - a.score);
  const n = scored.length;
  return scored.map((t, i) => {
    let tier = 3;
    if (i < Math.ceil(n * 0.28)) tier = 5;
    else if (i < Math.ceil(n * 0.6)) tier = 4;
    return { ...t, tier };
  });
}

/* ============================================================
   STUDY PLANNER — SCHEDULE GENERATOR
   A transparent, rule-based allocator (not a black-box AI call):
   weak units get roughly double the study days of neutral units,
   strong units get less, and the last stretch before the exam is
   always reserved for revision + mock tests.
   ============================================================ */
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function generateSchedule(examDate, weakUnits, strongUnits) {
  const totalDays = daysUntil(examDate);
  if (totalDays === null) return null;
  if (totalDays <= 0) return { totalDays, expired: true, days: [] };

  const reserved = Math.min(4, Math.max(1, Math.round(totalDays * 0.15)));
  const studyDays = Math.max(1, totalDays - reserved);
  const weightOf = (id) => (weakUnits.includes(id) ? 2 : strongUnits.includes(id) ? 0.6 : 1);
  const weights = SYLLABUS.map((u) => ({ id: u.id, w: weightOf(u.id) }));
  const totalWeight = weights.reduce((a, u) => a + u.w, 0);
  let alloc = weights.map((u) => ({ id: u.id, days: Math.max(1, Math.round((studyDays * u.w) / totalWeight)) }));
  let diff = studyDays - alloc.reduce((a, u) => a + u.days, 0);
  let i = 0;
  while (diff !== 0 && i < 1000) {
    const idx = i % alloc.length;
    if (diff > 0) { alloc[idx].days += 1; diff -= 1; }
    else if (alloc[idx].days > 1) { alloc[idx].days -= 1; diff += 1; }
    i += 1;
  }
  alloc.sort((a, b) => weightOf(b.id) - weightOf(a.id));

  const days = [];
  let dayNum = 1;
  alloc.forEach((u) => {
    const unit = SYLLABUS.find((x) => x.id === u.id);
    for (let d = 0; d < u.days; d++) {
      days.push({ day: dayNum, focus: `Unit ${u.id} — ${unit.title}`, weak: weakUnits.includes(u.id), tasks: ["Read/revise notes for this unit", "Attempt unit MCQs, prioritising any flagged weak topics"] });
      dayNum += 1;
    }
  });
  for (let r = 0; r < reserved; r++) {
    const last = r === reserved - 1;
    days.push({ day: dayNum, focus: "Final Revision + Mock Test", weak: false, tasks: last ? ["Attempt the Official ESE Simulation", "Review every wrong answer"] : ["One Night Before Exam pass + Flashcards", "Retest anything in the Mistake Book"] });
    dayNum += 1;
  }
  return { totalDays, reserved, studyDays, days };
}

/* ============================================================
   COVERAGE ENGINE
   ============================================================ */
function nodeCompleteness(node) {
  const keys = node.type === "ACTIVITY" ? ACTIVITY_KEYS : THEORY_KEYS;
  const done = keys.filter((k) => (typeof node.artifacts[k] === "number" ? node.artifacts[k] > 0 : node.artifacts[k])).length;
  return done / keys.length;
}
function nodeStatus(node) {
  const c = nodeCompleteness(node);
  if (c === 0) return "NOT STARTED";
  if (c < 1) return "IN PROGRESS";
  return "GENERATED";
}
function statusClass(status) {
  if (status === "NOT STARTED") return "";
  if (status === "IN PROGRESS") return "progress";
  return "ready";
}
function unitNodes(unit) { return [...unit.topics, ...unit.activities]; }
function unitProgress(unit) {
  const nodes = unitNodes(unit);
  if (!nodes.length) return 0;
  const sum = nodes.reduce((acc, n) => acc + nodeCompleteness(n), 0);
  return Math.round((sum / nodes.length) * 100);
}
function overallProgress(syllabus) {
  const all = syllabus.flatMap(unitNodes);
  if (!all.length) return 0;
  const sum = all.reduce((acc, n) => acc + nodeCompleteness(n), 0);
  return Math.round((sum / all.length) * 100);
}
function syllabusTotals(syllabus) {
  const topics = syllabus.reduce((a, u) => a + u.topics.length, 0);
  const activities = syllabus.reduce((a, u) => a + u.activities.length, 0);
  return { units: syllabus.length, topics, activities };
}

  return (

      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--sae-border)" strokeWidth="8" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--sae-ochre)" strokeWidth="8" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset} transform={`rotate(-90 ${size / 2} ${size / 2})`} />
        <circle cx={size / 2} cy={size / 2} r={r - 14} fill="none" stroke="var(--sae-ink-soft)" strokeWidth="1" strokeDasharray="2 5" opacity="0.6" />

  );
}

          color: node.type === "ACTIVITY" ? "var(--sae-green)" : "var(--sae-ink-soft)",
        }}>{node.type === "ACTIVITY" ? "ACTIVITY" : "THEORY"}</span>

            <div style={{ width: "100%", fontSize: 11.5, color: "var(--sae-ink-soft)", marginBottom: 4 }}>

            </div>
          )}

            const done = typeof val === "number" ? val > 0 : val;

  );
}

/* ============================================================
   BOOKMARK HOOK (window.storage, personal scope)
   Generalized with a storage key so different sections (Notes,
   MCQs, ...) keep independent bookmark sets.
   ============================================================ */
function useBookmarkStore(storageKey) {
  const [bookmarks, setBookmarks] = useState({});
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet(storageKey, {});
    setBookmarks(saved);
    setLoaded(true);
  })(); }, [storageKey]);
  const toggle = useCallback((id) => {
    setBookmarks((prev) => {
      const next = { ...prev, [id]: !prev[id] };
      storageSet(storageKey, next);
      return next;
    });
  }, [storageKey]);
  return { bookmarks, toggle, loaded };
}

/* ============================================================
   MCQ PROGRESS + MISTAKE BOOK HOOKS (window.storage, personal)
   ============================================================ */
function useMCQProgress() {
  const [progress, setProgress] = useState({});
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("mcq:progress", {});
    setProgress(saved);
    setLoaded(true);
  })(); }, []);
  const recordAnswer = useCallback((unitId, correct) => {
    setProgress((prev) => {
      const cur = prev[unitId] || { attempted: 0, correct: 0, wrong: 0 };
      const next = {
        ...prev,
        [unitId]: {
          attempted: cur.attempted + 1,
          correct: cur.correct + (correct ? 1 : 0),
          wrong: cur.wrong + (correct ? 0 : 1),
        },
      };
      storageSet("mcq:progress", next);
      return next;
    });
  }, []);
  return { progress, recordAnswer, loaded };
}

function useMistakes() {
  const [mistakes, setMistakes] = useState({});
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("mcq:mistakes", {});
    setMistakes(saved);
    setLoaded(true);
  })(); }, []);
  const addMistake = useCallback((q, studentAnswer) => {
    setMistakes((prev) => {
      const next = { ...prev, [q.id]: { question: q.question, correctAnswer: q.correctAnswer, studentAnswer, explanation: q.explanation, unit: q.unit, topic: q.mainTopic, date: new Date().toISOString().slice(0, 10) } };
      storageSet("mcq:mistakes", next);
      return next;
    });
  }, []);
  const removeMistake = useCallback((id) => {
    setMistakes((prev) => {
      if (!prev[id]) return prev;
      const next = { ...prev };
      delete next[id];
      storageSet("mcq:mistakes", next);
      return next;
    });
  }, []);
  return { mistakes, addMistake, removeMistake, loaded };
}

function Stars({ count }) {
  return (

        <Star key={i} size={11} color="var(--sae-ochre)" fill={i <= count ? "var(--sae-ochre)" : "none"} />
      ))}
    </span>
  );
}

/* ============================================================
   QUIZ ENGINE
   One reusable session player — powers MCQ Bank practice and
   Rapid Fire now, and will power Mock Test / OMR mode in Phase 8
   without needing to be rebuilt.
   ============================================================ */
function QuizSession({ questions, title, onExit, recordAnswer, addMistake, removeMistake }) {
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState({}); // qId -> selected letter
  const [finished, setFinished] = useState(false);

  const q = questions[index];
  const selected = answers[q.id];
  const answered = selected !== undefined;

  const choose = (letter) => {
    if (answered) return;
    const correct = letter === q.correctAnswer;
    setAnswers((a) => ({ ...a, [q.id]: letter }));
    recordAnswer(q.unit, correct);
    if (correct) removeMistake(q.id);
    else addMistake(q, letter);
  };

  const next = () => {
    if (index < questions.length - 1) setIndex((i) => i + 1);
    else setFinished(true);
  };

  if (finished) {
    const total = questions.length;
    const correctCount = questions.filter((qq) => answers[qq.id] === qq.correctAnswer).length;
    const wrongQs = questions.filter((qq) => answers[qq.id] && answers[qq.id] !== qq.correctAnswer);
    const accuracy = Math.round((correctCount / total) * 100);
    return (
      <div className="sae-card" style={{ padding: 24, maxWidth: 520, margin: "20px auto" }}>
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <Trophy size={30} color="var(--sae-ochre)" />
          <h2 className="sae-display" style={{ fontSize: 20, fontWeight: 700, margin: "10px 0 4px" }}>{title} — Complete</h2>
          <p style={{ fontSize: 14, color: "var(--sae-ink-soft)" }}>{correctCount} / {total} correct · {accuracy}% accuracy</p>
        </div>
        {wrongQs.length > 0 && (
          <div style={{ marginBottom: 16 }}>
            <h3 className="sae-display" style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Review missed questions</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {wrongQs.map((wq) => (
                <div key={wq.id} style={{ fontSize: 12, background: "var(--sae-paper)", borderRadius: 10, padding: 10 }}>
                  <div style={{ fontWeight: 600, marginBottom: 4 }}>{wq.question}</div>
                  <div style={{ color: "var(--sae-red)" }}>Your answer: {answers[wq.id]}) {wq["option" + answers[wq.id]]}</div>
                  <div style={{ color: "var(--sae-green)" }}>Correct: {wq.correctAnswer}) {wq["option" + wq.correctAnswer]}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{ display: "flex", gap: 10 }}>
          {wrongQs.length > 0 && (
            <button className="sae-btn-ghost" style={{ flex: 1, padding: "10px 0" }} onClick={() => onExit(wrongQs)}>Retry Wrong Only</button>
          )}
          <button className="sae-btn-primary" style={{ flex: 1, padding: "10px 0" }} onClick={() => onExit(null)}>Done</button>
        </div>
      </div>
    );
  }

  return (
    <div className="sae-card" style={{ padding: 20, maxWidth: 560, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span className="sae-mono" style={{ fontSize: 11, color: "var(--sae-ink-soft)" }}>{title} · Q{index + 1} / {questions.length}</span>
        <button className="sae-btn-ghost" style={{ padding: "4px 12px", fontSize: 11.5 }} onClick={() => onExit(null)}>Exit</button>
      </div>
      <div className="sae-progress-track" style={{ height: 5, marginBottom: 16 }}>
        <div className="sae-progress-fill" style={{ width: `${((index + (answered ? 1 : 0)) / questions.length) * 100}%` }} />
      </div>
      <p style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.5, marginBottom: 16 }}>{q.question}</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: answered ? 14 : 0 }}>
        {["A", "B", "C", "D"].map((letter) => {
          const isCorrect = letter === q.correctAnswer;
          const isPicked = letter === selected;
          let bg = "var(--sae-paper-raised)", border = "var(--sae-border)", color = "var(--sae-ink)";
          if (answered && isCorrect) { bg = "var(--sae-green-soft)"; border = "var(--sae-green)"; color = "var(--sae-green)"; }
          else if (answered && isPicked && !isCorrect) { bg = "var(--sae-red-soft)"; border = "var(--sae-red)"; color = "var(--sae-red)"; }
          return (
            <button
              key={letter}
              onClick={() => choose(letter)}
              disabled={answered}
              style={{ textAlign: "left", padding: "11px 14px", borderRadius: 12, border: `1.5px solid ${border}`, background: bg, color, fontSize: 13.5, cursor: answered ? "default" : "pointer", display: "flex", alignItems: "center", gap: 10 }}
            >
              <span className="sae-mono" style={{ fontWeight: 700, fontSize: 12 }}>{letter}</span>
              <span style={{ flex: 1 }}>{q["option" + letter]}</span>
              {answered && isCorrect && <CheckCircle2 size={16} />}
              {answered && isPicked && !isCorrect && <XCircle size={16} />}
            </button>
          );
        })}
      </div>
      {answered && (
        <>
          <div style={{ display: "flex", gap: 8, background: "var(--sae-paper)", borderRadius: 10, padding: 12, marginBottom: 14 }}>
            <Lightbulb size={15} color="var(--sae-ochre)" style={{ flexShrink: 0, marginTop: 1 }} />
            <p style={{ fontSize: 12.5, color: "var(--sae-ink-soft)", lineHeight: 1.6 }}>{q.explanation}</p>
          </div>
          <button className="sae-btn-primary" style={{ width: "100%", padding: "11px 0" }} onClick={next}>
            {index < questions.length - 1 ? "Next Question" : "Finish"}
          </button>
        </>
      )}
    </div>
  );
}

/* ============================================================
   MCQ BANK VIEW
   Practice by unit/difficulty, Rapid Fire, and the Mistake Book
   — all sharing the same QuizSession engine above.
   ============================================================ */
function MCQBank() {
  const [subTab, setSubTab] = useState("practice");
  const [unitFilter, setUnitFilter] = useState("ALL");
  const [difficultyFilter, setDifficultyFilter] = useState("ALL");
  const [query, setQuery] = useState("");
  const [bookmarkedOnly, setBookmarkedOnly] = useState(false);
  const [showList, setShowList] = useState(false);
  const [session, setSession] = useState(null);
  const { progress, recordAnswer } = useMCQProgress();
  const { mistakes, addMistake, removeMistake } = useMistakes();
  const { bookmarks: mcqBookmarks, toggle: toggleMcqBookmark } = useBookmarkStore("bookmarks:mcq");

  const filtered = MCQ_BANK.filter((q) => (unitFilter === "ALL" || q.unit === unitFilter) && (difficultyFilter === "ALL" || q.difficulty === difficultyFilter) && (query === "" || q.question.toLowerCase().includes(query.toLowerCase())) && (!bookmarkedOnly || mcqBookmarks[q.id]));
  const unitsWithMcq = [...new Set(MCQ_BANK.map((q) => q.unit))];
  const totalAttempted = Object.values(progress).reduce((a, p) => a + p.attempted, 0);
  const totalCorrect = Object.values(progress).reduce((a, p) => a + p.correct, 0);
  const overallAccuracy = totalAttempted ? Math.round((totalCorrect / totalAttempted) * 100) : null;
  const mistakeList = Object.entries(mistakes).map(([id, m]) => ({ id, ...m }));

  const startSession = (qs, title) => setSession({ qs, title });
  const exitSession = (retryList) => {
    if (retryList && retryList.length) {
      const qMap = Object.fromEntries(MCQ_BANK.map((q) => [q.id, q]));
      const asFull = retryList.map((q) => qMap[q.id] || q);
      setSession({ qs: asFull, title: session.title + " · Retry" });
    } else {
      setSession(null);
    }
  };

  if (session) {
    return (
      <QuizSession
        questions={session.qs}
        title={session.title}
        onExit={exitSession}
        recordAnswer={recordAnswer}
        addMistake={addMistake}
        removeMistake={removeMistake}
      />
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, paddingBottom: 24 }}>
      <div className="sae-card" style={{ padding: 16 }}>
        <h2 className="sae-display" style={{ fontWeight: 700, fontSize: 17, marginBottom: 6 }}>MCQ Bank</h2>
        <p style={{ fontSize: 12.5, color: "var(--sae-ink-soft)", lineHeight: 1.6, marginBottom: 10 }}>
          {MCQ_BANK.length} questions written so far across all 5 units. More are added over time,
          toward the 50–60-per-unit target (currently strongest in Units I, II, and V).
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <span className="sae-stamp">{totalAttempted} Attempted</span>
          <span className="sae-stamp">{totalCorrect} Correct</span>
          {overallAccuracy !== null && <span className={`sae-stamp ${overallAccuracy >= 60 ? "ready" : "weak"}`}>{overallAccuracy}% Accuracy</span>}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <button className={`sae-chip${subTab === "practice" ? " active" : ""}`} onClick={() => setSubTab("practice")}>Practice</button>
        <button className={`sae-chip${subTab === "rapidfire" ? " active" : ""}`} onClick={() => setSubTab("rapidfire")}><Zap size={11} style={{ marginRight: 4, verticalAlign: -1 }} />Rapid Fire</button>
        <button className={`sae-chip${subTab === "mistakes" ? " active" : ""}`} onClick={() => setSubTab("mistakes")}>Mistake Book {mistakeList.length > 0 ? `(${mistakeList.length})` : ""}</button>
      </div>

      {subTab === "practice" && (
        <>
          <div style={{ position: "relative" }}>
            <Search size={14} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--sae-ink-soft)" }} />
            <input className="sae-input" placeholder="Search questions..." value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            <button className={`sae-chip${unitFilter === "ALL" ? " active" : ""}`} onClick={() => setUnitFilter("ALL")}>All Units</button>
            {SYLLABUS.map((u) => (
              <button key={u.id} className={`sae-chip${unitFilter === u.id ? " active" : ""}`} onClick={() => setUnitFilter(u.id)}>
                Unit {u.id}{!unitsWithMcq.includes(u.id) ? " ·" : ""}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {["ALL", "Easy", "Medium", "Hard"].map((d) => (
              <button key={d} className={`sae-chip${difficultyFilter === d ? " active" : ""}`} onClick={() => setDifficultyFilter(d)}>{d}</button>
            ))}
            <button className={`sae-chip${bookmarkedOnly ? " active" : ""}`} onClick={() => setBookmarkedOnly((b) => !b)}>
              <Bookmark size={11} style={{ marginRight: 4, verticalAlign: -1 }} />Bookmarked
            </button>
          </div>
          <div className="sae-card" style={{ padding: 18, textAlign: "center" }}>
            <Target size={22} color="var(--sae-ochre)" style={{ marginBottom: 8 }} />
            <p style={{ fontSize: 13.5, marginBottom: 12 }}>{filtered.length} question{filtered.length !== 1 ? "s" : ""} match this filter.</p>
            <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
              <button className="sae-btn-primary" style={{ padding: "10px 22px" }} disabled={filtered.length === 0} onClick={() => startSession(filtered, "Practice")}>
                Start Practice
              </button>
              <button className="sae-btn-ghost" style={{ padding: "10px 18px" }} disabled={filtered.length === 0} onClick={() => setShowList((s) => !s)}>
                {showList ? "Hide" : "Browse"} Questions
              </button>
            </div>
          </div>
          {showList && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filtered.map((q) => (
                <div key={q.id} className="sae-card" style={{ padding: 12, display: "flex", alignItems: "flex-start", gap: 8 }}>
                  <span className="sae-mono" style={{ fontSize: 9, color: "var(--sae-ink-soft)", flexShrink: 0, marginTop: 2 }}>U{q.unit}</span>
                  <p style={{ fontSize: 12.5, flex: 1, lineHeight: 1.5 }}>{q.question}</p>
                  <button className="sae-icon-btn" style={{ width: 26, height: 26, flexShrink: 0 }} onClick={() => toggleMcqBookmark(q.id)} aria-label="Bookmark question">
                    {mcqBookmarks[q.id] ? <BookmarkCheck size={12} color="var(--sae-ochre)" /> : <Bookmark size={12} />}
                  </button>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {subTab === "rapidfire" && (
        <div className="sae-card" style={{ padding: 18 }}>
          <p style={{ fontSize: 12.5, color: "var(--sae-ink-soft)", marginBottom: 14 }}>
            A quick, untimed shuffle through the current question bank ({MCQ_BANK.length} available). Counts above
            what's written yet are capped to what exists — nothing is padded with repeats.
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {[10, 15, MCQ_BANK.length].filter((n, i, arr) => arr.indexOf(n) === i && n > 0).map((n) => (
              <button key={n} className="sae-btn-ghost" style={{ padding: "10px 18px" }} onClick={() => startSession([...MCQ_BANK].sort(() => Math.random() - 0.5).slice(0, n), `Rapid Fire (${Math.min(n, MCQ_BANK.length)})`)}>
                {Math.min(n, MCQ_BANK.length)} Questions
              </button>
            ))}
          </div>
        </div>
      )}

      {subTab === "mistakes" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {mistakeList.length === 0 && (
            <div className="sae-card" style={{ padding: 20, textAlign: "center", fontSize: 13, color: "var(--sae-ink-soft)" }}>
              No mistakes saved yet — they'll collect here automatically whenever you answer a practice question wrong.
            </div>
          )}
          {mistakeList.length > 0 && (
            <button className="sae-btn-primary" style={{ padding: "10px 0" }} onClick={() => {
              const qMap = Object.fromEntries(MCQ_BANK.map((q) => [q.id, q]));
              const qs = mistakeList.map((m) => qMap[m.id]).filter(Boolean);
              if (qs.length) startSession(qs, "Mistake Book");
            }}>
              <RotateCcw size={14} style={{ marginRight: 6, verticalAlign: -2 }} />Practice All Mistakes Again
            </button>
          )}
          {mistakeList.map((m) => (
            <div key={m.id} className="sae-card" style={{ padding: 14 }}>
              <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>{m.question}</p>
              <p style={{ fontSize: 12, color: "var(--sae-red)" }}>Your answer: {m.studentAnswer}</p>
              <p style={{ fontSize: 12, color: "var(--sae-green)" }}>Correct: {m.correctAnswer}</p>
              <p style={{ fontSize: 11.5, color: "var(--sae-ink-soft)", marginTop: 6 }}>{m.explanation}</p>
              <p style={{ fontSize: 10, color: "var(--sae-ink-soft)", marginTop: 6 }} className="sae-mono">Logged {m.date}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ACTIVITY STATUS HOOK (window.storage, personal scope)
   ============================================================ */
function useActivityStatus() {
  const [status, setStatus] = useState({});
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("activities:status", {});
    setStatus(saved);
    setLoaded(true);
  })(); }, []);
  const setActivityStatus = useCallback((id, value) => {
    setStatus((prev) => {
      const next = { ...prev, [id]: value };
      storageSet("activities:status", next);
      return next;
    });
  }, []);
  return { status, setActivityStatus, loaded };
}

const STATUS_CYCLE = ["NOT STARTED", "IN PROGRESS", "DONE"];
function StatusBadge({ value, onClick }) {
  const idx = STATUS_CYCLE.indexOf(value || "NOT STARTED");
  const Icon = idx === 2 ? CheckCircle2 : idx === 1 ? MinusCircle : Circle;
  const cls = idx === 2 ? "ready" : idx === 1 ? "progress" : "";
  return (
    <button onClick={onClick} className={`sae-stamp ${cls}`} style={{ border: "1.5px dashed", cursor: "pointer" }}>
      <Icon size={12} />{STATUS_CYCLE[idx]}
    </button>
  );
}

/* ============================================================
   REVISION STREAK HOOK (window.storage, personal scope)
   ============================================================ */
function useRevisionStreak() {
  const [streak, setStreak] = useState({ current: 0, longest: 0, lastDate: null });
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("revision:streak", { current: 0, longest: 0, lastDate: null });
    const today = new Date().toISOString().slice(0, 10);
    if (saved.lastDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const nextCurrent = saved.lastDate === yesterday ? saved.current + 1 : 1;
      const updated = { current: nextCurrent, longest: Math.max(saved.longest, nextCurrent), lastDate: today };
      setStreak(updated);
      storageSet("revision:streak", updated);
    } else {
      setStreak(saved);
    }
    setLoaded(true);
  })(); }, []);
  return { streak, loaded };
}

/* ============================================================
   EXAM SESSION ENGINE
   Distinct from the practice QuizSession: no answer is revealed
   until submission (real exam behaviour), has a countdown timer,
   a question palette, mark-for-review, and two layouts —
   sequential (one question at a time) and OMR (all questions on
   one sheet with bubble-style options).
   ============================================================ */
function useCountdown(totalSeconds, onExpire) {
  const [remaining, setRemaining] = useState(totalSeconds);
  useEffect(() => {
    if (totalSeconds === null) return;
    if (remaining <= 0) { onExpire(); return; }
    const t = setTimeout(() => setRemaining((r) => r - 1), 1000);
    return () => clearTimeout(t);
  }, [remaining, totalSeconds]);
  return remaining;
}

function formatTime(sec) {
  if (sec === null) return "--:--";
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function ExamSession({ questions, title, durationMinutes, layout, onExit }) {
  const [answers, setAnswers] = useState({});

  const [index, setIndex] = useState(0);

  const totalSeconds = durationMinutes ? durationMinutes * 60 : null;
  const remaining = useCountdown(totalSeconds, () => !submitted && setSubmitted(true));

  const select = (qId, letter) => setAnswers((a) => ({ ...a, [qId]: letter }));
  const toggleMark = (qId) => setMarked((m) => ({ ...m, [qId]: !m[qId] }));

  if (submitted) {
    const timeTakenSec = Math.round((Date.now() - startTime) / 1000);
    const correct = questions.filter((q) => answers[q.id] === q.correctAnswer).length;
    const wrong = questions.filter((q) => answers[q.id] && answers[q.id] !== q.correctAnswer).length;
    const unattempted = questions.length - correct - wrong;
    const accuracyOfAttempted = (correct + wrong) > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0;
    const unitBreakdown = SYLLABUS.map((u) => {
      const uq = questions.filter((q) => q.unit === u.id);

      <div style={{ display: "flex", flexDirection: "column", gap: 16, paddingBottom: 24 }}>
        <div className="sae-card" style={{ padding: 24, textAlign: "center" }}>

            <span className="sae-stamp">{accuracyOfAttempted}% Accuracy (attempted)</span>
            <span className="sae-stamp"><Clock size={11} />{formatTime(timeTakenSec)} taken</span>
          </div>
        </div>

        <div className="sae-card" style={{ padding: 16 }}>
          <h3 className="sae-display" style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>Unit-wise Analysis</h3>

            <div key={u.unit} style={{ marginBottom: 8 }}>

            {questions.map((q, i) => {
              const yourAns = answers[q.id];

    );

    if (marked[qId]) return "marked";
    if (answers[qId]) return "answered";

            <button className="sae-btn-ghost" style={{ flex: 1, padding: "9px 0" }} onClick={() => setConfirmSubmit(false)}>Keep Working</button>
            <button className="sae-btn-primary" style={{ flex: 1, padding: "9px 0" }} onClick={() => setSubmitted(true)}>Submit Test</button>
          </div>

      {layout === "omr" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {questions.map((qq, i) => (
            <div key={qq.id} className="sae-card" style={{ padding: 14 }}>

              <button className="sae-btn-ghost" style={{ padding: "9px 16px" }} onClick={() => { const next = { ...answers }; delete next[q.id]; setAnswers(next); }}>Clear</button>

              <button className="sae-btn-primary" style={{ padding: "9px 16px", marginLeft: "auto" }} onClick={() => setIndex((i) => Math.min(i + 1, questions.length - 1))}>Save &amp; Next</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function useTestAttempts() {
  const [attempts, setAttempts] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("mocktest:attempts", []);
    setAttempts(saved);
    setLoaded(true);
  })(); }, []);
  const addAttempt = useCallback((result) => {
    setAttempts((prev) => {
      const next = [{ ...result, date: new Date().toISOString() }, ...prev].slice(0, 20);
      storageSet("mocktest:attempts", next);
      return next;
    });
  }, []);
  return { attempts, addAttempt, loaded };
}

/* ============================================================
   PLANNER HOOKS (window.storage, personal scope)
   ============================================================ */
function usePlannerConfig() {
  const [config, setConfig] = useState({ examDate: "", hoursPerDay: 2, weakUnits: [], strongUnits: [] });
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("planner:config", { examDate: "", hoursPerDay: 2, weakUnits: [], strongUnits: [] });
    setConfig(saved);
    setLoaded(true);
  })(); }, []);
  const save = useCallback((next) => {
    setConfig(next);
    storageSet("planner:config", next);
  }, []);
  return { config, save, loaded };
}

function useDailyTargets() {
  const [targets, setTargets] = useState({ mcq: 15, flashcards: 10, activityMinutes: 20 });
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { (async () => {
    const saved = await storageGet("planner:dailyTargets", { mcq: 15, flashcards: 10, activityMinutes: 20 });
    setTargets(saved);
    setLoaded(true);
  })(); }, []);
  const save = useCallback((next) => {
    setTargets(next);
    storageSet("planner:dailyTargets", next);
  }, []);
  return { targets, save, loaded };
}

function useDailyProgress(totals, ready) {
  const [baseline, setBaseline] = useState(null);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    if (!ready) return;
    (async () => {
      const today = new Date().toISOString().slice(0, 10);
      const saved = await storageGet("daily:baseline", null);
      if (!saved || saved.date !== today) {
        const fresh = { date: today, ...totals };
        setBaseline(fresh);
        storageSet("daily:baseline", fresh);
      } else {
        setBaseline(saved);
      }
      setLoaded(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ready]);
  return { baseline, loaded };
}

function recommendNextAction({ weakTopicsCount, notesProgress, doneActivities, totalActivities, mockAttempts }) {
  if (weakTopicsCount > 0) return `You have ${weakTopicsCount} weak topic${weakTopicsCount > 1 ? "s" : ""} flagged — revisit them in Quick Revision → Smart Revision before moving on.`;
  if (notesProgress < 100) return `Overall syllabus coverage is at ${notesProgress}% — keep working through the units in the Syllabus Map.`;
  if (doneActivities < totalActivities) return `${totalActivities - doneActivities} of ${totalActivities} activities are still pending — they carry real internal marks.`;
  if (mockAttempts === 0) return "You haven't attempted a mock test yet — try the Official ESE Simulation to check your readiness.";
  return "Solid progress across the board — keep reinforcing with Flashcards and Rapid Fire MCQs.";
}

/* ============================================================
   STUDY PLANNER VIEW
   ============================================================ */
function PlannerView() {
  const { config, save: saveConfig, loaded: configLoaded } = usePlannerConfig();
  const { targets, save: saveTargets } = useDailyTargets();
  const { progress: mcqProgress, loaded: mcqLoaded } = useMCQProgress();
  const { mistakes } = useMistakes();
  const { status: activityStatus, loaded: actLoaded } = useActivityStatus();
  const { attempts: testAttempts } = useTestAttempts();
  const [flashTotal, setFlashTotal] = useState(0);
  const [flashLoaded, setFlashLoaded] = useState(false);

  useEffect(() => { (async () => {
    const saved = await storageGet("flashcards:known", {});
    setFlashTotal(Object.keys(saved).length);
    setFlashLoaded(true);
  })(); }, []);

  const mcqTotal = Object.values(mcqProgress).reduce((a, p) => a + p.attempted, 0);
  const activitiesDoneTotal = Object.values(activityStatus).filter((s) => s === "DONE").length;
  const ready = mcqLoaded && flashLoaded && actLoaded;
  const { baseline, loaded: baselineLoaded } = useDailyProgress({ mcq: mcqTotal, flashcards: flashTotal, activities: activitiesDoneTotal }, ready);
  const todayMcq = baselineLoaded ? Math.max(0, mcqTotal - baseline.mcq) : 0;
  const todayFlash = baselineLoaded ? Math.max(0, flashTotal - baseline.flashcards) : 0;

  const topicMistakeCounts = {};
  Object.values(mistakes).forEach((m) => { if (m.topic) topicMistakeCounts[m.topic] = (topicMistakeCounts[m.topic] || 0) + 1; });
  const weakTopicsCount = Object.values(topicMistakeCounts).filter((c) => c >= 2).length;
  const notesProgress = overallProgress(SYLLABUS);
  const totalActivities = SYLLABUS.flatMap((u) => u.activities).length;

  const nextAction = recommendNextAction({ weakTopicsCount, notesProgress, doneActivities: activitiesDoneTotal, totalActivities, mockAttempts: testAttempts.length });

  const toggleUnitTag = (unitId, list) => {
    const key = list === "weak" ? "weakUnits" : "strongUnits";
    const other = list === "weak" ? "strongUnits" : "weakUnits";
    const has = config[key].includes(unitId);
    const nextList = has ? config[key].filter((x) => x !== unitId) : [...config[key], unitId];
    saveConfig({ ...config, [key]: nextList, [other]: config[other].filter((x) => x !== unitId) });
  };

  const schedule = configLoaded && config.examDate ? generateSchedule(config.examDate, config.weakUnits, config.strongUnits) : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, paddingBottom: 24 }}>
      <div className="sae-card" style={{ padding: 16 }}>
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
          <Lightbulb size={16} color="var(--sae-ochre)" style={{ flexShrink: 0, marginTop: 2 }} />
          <div>
            <span className="sae-mono" style={{ fontSize: 10, color: "var(--sae-ink-soft)", textTransform: "uppercase" }}>Recommended Next Action</span>
            <p style={{ fontSize: 13.5, marginTop: 4, lineHeight: 1.6 }}>{nextAction}</p>
          </div>
        </div>
      </div>

      <div className="sae-card" style={{ padding: 16 }}>
        <h3 className="sae-display" style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Exam Setup</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <label style={{ fontSize: 12.5 }}>
            Exam date
            <input type="date" className="sae-input" style={{ paddingLeft: 12, marginTop: 4 }} value={config.examDate} onChange={(e) => saveConfig({ ...config, examDate: e.target.value })} />
          </label>
          <label style={{ fontSize: 12.5 }}>
            Study hours per day
            <input type="number" min="0.5" step="0.5" className="sae-input" style={{ paddingLeft: 12, marginTop: 4 }} value={config.hoursPerDay} onChange={(e) => saveConfig({ ...config, hoursPerDay: parseFloat(e.target.value) || 0 })} />
          </label>
          <div>
            <span style={{ fontSize: 12.5 }}>Mark units as weak or strong (optional — shapes the schedule)</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 6 }}>
              {SYLLABUS.map((u) => (
                <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 12, width: 90, flexShrink: 0 }}>Unit {u.id}</span>
                  <button className={`sae-chip${config.weakUnits.includes(u.id) ? " active" : ""}`} onClick={() => toggleUnitTag(u.id, "weak")}>Weak</button>
                  <button className={`sae-chip${config.strongUnits.includes(u.id) ? " active" : ""}`} onClick={() => toggleUnitTag(u.id, "strong")}>Strong</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="sae-card" style={{ padding: 16 }}>
        <h3 className="sae-display" style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Today's Targets</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {[
            { key: "mcq", label: "MCQs practiced", today: todayMcq },
            { key: "flashcards", label: "Flashcards reviewed", today: todayFlash },
          ].map((t) => (
            <div key={t.key}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
                <span>{t.label}</span>
                <span className="sae-mono">{t.today} / {targets[t.key]}</span>
              </div>
              <div className="sae-progress-track" style={{ height: 7 }}>
                <div className="sae-progress-fill" style={{ width: `${Math.min(100, (t.today / (targets[t.key] || 1)) * 100)}%` }} />
              </div>
            </div>
          ))}
          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <label style={{ fontSize: 11.5, flex: 1 }}>
              Daily MCQ target
              <input type="number" min="1" className="sae-input" style={{ paddingLeft: 12, marginTop: 4 }} value={targets.mcq} onChange={(e) => saveTargets({ ...targets, mcq: parseInt(e.target.value) || 1 })} />
            </label>
            <label style={{ fontSize: 11.5, flex: 1 }}>
              Daily flashcard target
              <input type="number" min="1" className="sae-input" style={{ paddingLeft: 12, marginTop: 4 }} value={targets.flashcards} onChange={(e) => saveTargets({ ...targets, flashcards: parseInt(e.target.value) || 1 })} />
            </label>
          </div>
        </div>
      </div>

      {schedule && !schedule.expired && (
        <div className="sae-card" style={{ padding: 16 }}>
          <h3 className="sae-display" style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>Generated Schedule</h3>
          <p style={{ fontSize: 11.5, color: "var(--sae-ink-soft)", marginBottom: 12 }}>
            {schedule.totalDays} days to go · {schedule.studyDays} study days · last {schedule.reserved} reserved for revision + mock tests.
            Weak-tagged units get roughly double the study days.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 380, overflowY: "auto" }}>
            {schedule.days.slice(0, 21).map((d) => (
              <div key={d.day} style={{ display: "flex", gap: 10, fontSize: 12, padding: "6px 0", borderTop: "1px solid var(--sae-border)" }}>
                <span className="sae-mono" style={{ width: 44, flexShrink: 0, color: "var(--sae-ink-soft)" }}>Day {d.day}</span>
                <div>
                  <div style={{ fontWeight: 600 }}>{d.focus}{d.weak && <span className="sae-stamp weak" style={{ marginLeft: 6, fontSize: 8, padding: "1px 6px" }}>Weak</span>}</div>
                  <div style={{ color: "var(--sae-ink-soft)" }}>{d.tasks.join(" · ")}</div>
                </div>
              </div>
            ))}
          </div>
          {schedule.days.length > 21 && <p style={{ fontSize: 11, color: "var(--sae-ink-soft)", marginTop: 8 }}>+ {schedule.days.length - 21} more days following the same rotation.</p>}
        </div>
      )}
      {schedule && schedule.expired && (
        <div className="sae-card" style={{ padding: 16, textAlign: "center" }}>
          <p style={{ fontSize: 13, color: "var(--sae-red)" }}>Your set exam date has already passed — update it above, or head straight to Final Revision and Mock Test.</p>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   MY BOOKMARKS VIEW
   Aggregates the independent bookmark stores (Notes, MCQs,
   Flashcards, Activities) into one place, per the spec's
   "My Bookmarks" requirement.
   ============================================================ */
function MyBookmarksView({ onNavigate }) {
  const { bookmarks: noteBookmarks } = useBookmarkStore("bookmarks:notes");
  const { bookmarks: mcqBookmarks } = useBookmarkStore("bookmarks:mcq");
  const { bookmarks: flashBookmarks } = useBookmarkStore("bookmarks:flashcards");
  const { bookmarks: activityBookmarks } = useBookmarkStore("bookmarks:activities");
  const [session, setSession] = useState(null);
  const { recordAnswer } = useMCQProgress();
  const { addMistake, removeMistake } = useMistakes();

  const bookmarkedNoteIds = Object.keys(noteBookmarks).filter((k) => noteBookmarks[k]);
  const bookmarkedMcqIds = Object.keys(mcqBookmarks).filter((k) => mcqBookmarks[k]);
  const bookmarkedFlashIds = Object.keys(flashBookmarks).filter((k) => flashBookmarks[k]);
  const bookmarkedActivityIds = Object.keys(activityBookmarks).filter((k) => activityBookmarks[k]);

  const noteTopics = bookmarkedNoteIds.map((id) => ({ id, title: topicTitle(id.split("-")[0].replace("U", ""), id) }));
  const mcqs = MCQ_BANK.filter((q) => bookmarkedMcqIds.includes(q.id));
  const flashcards = FLASHCARDS.filter((c) => bookmarkedFlashIds.includes(c.id));
  const activities = SYLLABUS.flatMap((u) => u.activities).filter((a) => bookmarkedActivityIds.includes(a.id));

  const total = noteTopics.length + mcqs.length + flashcards.length + activities.length;

  if (session) {
    return <QuizSession questions={session} title="Bookmarked MCQs" onExit={() => setSession(null)} recordAnswer={recordAnswer} addMistake={addMistake} removeMistake={removeMistake} />;
  }

  return (

function AboutView({ cinematic, audioCtx, onCinematicComplete }) {
  const qualifications = [
    { stage: "Completed", title: "Intermediate (Class 12)", detail: "Science stream" },
    { stage: "Completed", title: "Diploma in Mechanical Engineering", detail: "" },
    { stage: "In Progress", title: "Bachelor's Degree — Political Science (Honours)", detail: "Guru Nanak College, Dhanbad · Currently in Semester 2" },
  ];
  const NOTE_SCALE = [587.33, 659.25, 698.46, 783.99, 880]; // D5 E5 F5 G5 A5

  // Phase 3 timing (seconds), matching the CSS animation-delays below
  const photoDelay = 0, photoDur = 1.1;
  const nameDelay = 0.85, nameDur = 0.85;
  const roleDelay = 1.65, taglineDelay = 1.85;
  const itemsStart = 2.1, itemsStep = 0.25;
  const lastItemDelay = itemsStart + (qualifications.length - 1) * itemsStep;
  const footerDelay = lastItemDelay + 0.3 + 0.3;

  useEffect(() => {
    if (!cinematic) return;
    const timers = [];
    timers.push(setTimeout(() => devrevSwell(audioCtx), photoDelay * 1000));
    timers.push(setTimeout(() => devrevChime(audioCtx, 660, 0.07), nameDelay * 1000));
    qualifications.forEach((_, i) => {
      timers.push(setTimeout(() => devrevChime(audioCtx, NOTE_SCALE[i % NOTE_SCALE.length], 0.05), (itemsStart + i * itemsStep) * 1000));
    });
    timers.push(setTimeout(() => devrevChime(audioCtx, 990, 0.06), footerDelay * 1000));
    timers.push(setTimeout(() => { if (onCinematicComplete) onCinematicComplete(); }, (footerDelay + 1) * 1000));
    return () => timers.forEach(clearTimeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cinematic]);

  const ent = (name, delay, duration = 0.7) => (cinematic ? { animation: `${name} ${duration}s cubic-bezier(0.22,1,0.36,1) ${delay}s both` } : {});

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18, paddingBottom: 24 }}>
      <div className="sae-card" style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ background: "linear-gradient(135deg, var(--sae-ink), var(--sae-ochre))", padding: "28px 20px", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
          <div style={{ width: 128, height: 128, borderRadius: "9999px", padding: 4, background: "var(--sae-paper-raised)", boxShadow: "0 4px 18px rgba(0,0,0,0.25)", ...ent("devrev-photo-in", photoDelay, photoDur) }}>
            <img
              src={DEVELOPER_PHOTO}
              alt="Mantu Majee"
              style={{ width: "100%", height: "100%", borderRadius: "9999px", objectFit: "cover", display: "block" }}
            />
          </div>
          <h1 className="sae-display" style={{ fontWeight: 700, fontSize: 26, color: "var(--sae-paper)", marginTop: 16, marginBottom: 2, ...ent("devrev-name-in", nameDelay, nameDur) }}>
            Mantu Majee
          </h1>
          <p style={{ fontSize: 13, color: "var(--sae-paper)", opacity: 0.9, ...ent("devrev-fade-up", roleDelay) }}>Founder &amp; Developer of this App</p>
          <span className="sae-stamp" style={{ marginTop: 12, borderColor: "var(--sae-paper)", color: "var(--sae-paper)", ...ent("devrev-fade-up", taglineDelay) }}>
            <Sparkles size={12} /> Built with the help of Advanced AI Tools
          </span>
        </div>
      </div>

      <div className="sae-card" style={{ padding: 18, ...ent("devrev-fade-up", itemsStart) }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Info size={16} color="var(--sae-ochre)" />
          <h2 className="sae-display" style={{ fontWeight: 700, fontSize: 15 }}>About Me</h2>
        </div>
        <p style={{ fontSize: 13.5, lineHeight: 1.7, color: "var(--sae-ink)" }}>
          Hi, I'm <strong>Mantu Majee</strong>. I am currently a student at Guru Nanak College, Dhanbad, studying
          Political Science (Honours). I built this app to make Social Awareness Activities (SA-1) preparation
          simple, organised, and stress-free for students like me. Every note, question, and activity guide in
          this app is checked carefully against the official syllabus, so you can trust what you're studying.
        </p>
      </div>

      <div className="sae-card" style={{ padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <GraduationCap size={16} color="var(--sae-ochre)" />
          <h2 className="sae-display" style={{ fontWeight: 700, fontSize: 15 }}>Educational Qualification</h2>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
          {qualifications.map((q, i) => (
            <div key={i} style={{ display: "flex", gap: 12, paddingBottom: i < qualifications.length - 1 ? 18 : 0, ...ent("devrev-fade-up", itemsStart + i * itemsStep) }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{
                  width: 26, height: 26, borderRadius: "9999px", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                  background: q.stage === "In Progress" ? "var(--sae-ochre-soft)" : "var(--sae-green-soft)",
                  border: `2px solid ${q.stage === "In Progress" ? "var(--sae-ochre)" : "var(--sae-green)"}`,
                }}>
                  {q.stage === "In Progress" ? <MinusCircle size={13} color="var(--sae-ochre)" /> : <CheckCircle2 size={13} color="var(--sae-green)" />}
                </div>
                {i < qualifications.length - 1 && <div style={{ width: 2, flex: 1, background: "var(--sae-border)", marginTop: 4 }} />}
              </div>
              <div style={{ paddingBottom: 4 }}>
                <span className={`sae-stamp ${q.stage === "In Progress" ? "progress" : "ready"}`} style={{ fontSize: 9, marginBottom: 6, display: "inline-flex" }}>{q.stage}</span>
                <div style={{ fontWeight: 700, fontSize: 13.5 }}>{q.title}</div>
                {q.detail && <div style={{ fontSize: 12, color: "var(--sae-ink-soft)", marginTop: 2 }}>{q.detail}</div>}
              </div>

          ))}
        </div>
      </div>

      <div className="sae-card" style={{ padding: 18, ...ent("devrev-fade-up", footerDelay) }}>

        <p style={{ fontSize: 13, color: "var(--sae-ink-soft)", lineHeight: 1.7 }}>

        </p>

}

    { id: "activities", label: "Activities", icon: ClipboardList, desc: "10 tracked activities" },

    <div style={{ display: "flex", flexDirection: "column", gap: 28, paddingBottom: 24 }}>

        <div style={{ flex: "1 1 240px" }}>
          <span className="sae-stamp" style={{ marginBottom: 10, display: "inline-flex" }}><Flag size={12} /> BBMKU · Semester II · SA-1</span>

          <p style={{ color: "var(--sae-ink-soft)", fontSize: 14.5, lineHeight: 1.6, maxWidth: 460 }}>Complete syllabus-based preparation for BBMKU Semester-II Social Awareness Activities.</p>
          <div style={{ marginTop: 16, display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="sae-btn-primary" style={{ padding: "10px 18px", fontSize: 14 }} onClick={() => onNavigate("syllabus")}>View Syllabus Map</button>

      <section>

        <div className="sae-card" style={{ padding: 18, display: "flex", flexDirection: "column", gap: 14 }}>
          {SYLLABUS.map((u) => (
            <div key={u.id} onClick={() => onNavigate("syllabus")} style={{ cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}>
                <span style={{ fontWeight: 600 }}>Unit {u.id} · <span style={{ fontWeight: 400, color: "var(--sae-ink-soft)" }}>{u.title}</span></span>
                <span className="sae-mono" style={{ color: "var(--sae-ink-soft)" }}>{unitProgress(u)}%</span>
              </div>
              <div className="sae-progress-track" style={{ height: 8 }}>
                <div className="sae-progress-fill" style={{ width: `${unitProgress(u)}%` }} />

          ))}

          {quickActions.map((a) => {

              <button key={a.id} onClick={() => onNavigate(a.id)} className="sae-card sae-card-action" style={{ padding: 16, textAlign: "left", border: "1px solid var(--sae-border)" }}>

            <h3 className="sae-display" style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{p.title}</h3>
            <p style={{ fontSize: 12.5, color: "var(--sae-ink-soft)", lineHeight: 1.5 }}>{p.body}</p>
          </div>
        ))}
      </section>

      <button
        onClick={onMeetDeveloper}
        className="sae-card sae-card-action"
        style={{ padding: 14, display: "flex", alignItems: "center", gap: 12, textAlign: "left", border: "1px solid var(--sae-border)", width: "100%" }}
      >
        <img src={DEVELOPER_PHOTO} alt="Mantu Majee" style={{ width: 42, height: 42, borderRadius: "9999px", objectFit: "cover", flexShrink: 0, border: "2px solid var(--sae-ochre)" }} />
        <div style={{ flex: 1 }}>
          <div className="sae-display" style={{ fontWeight: 700, fontSize: 13 }}>Meet the Developer</div>
          <div style={{ fontSize: 11.5, color: "var(--sae-ink-soft)" }}>Made by Mantu Majee — tap to learn more</div>
        </div>
        <ChevronRight size={16} color="var(--sae-ink-soft)" />
      </button>
    </div>
  );
}

/* ============================================================

function App() {
  const [theme, setThemeState] = useState("light");
  const [view, setView] = useState("home");

  const [cinematicAbout, setCinematicAbout] = useState(false);
  const [revealAudioCtx, setRevealAudioCtx] = useState(null);

  useEffect(() => { (async () => {
    const savedTheme = await storageGet("settings:theme", "light");
    setThemeState(savedTheme);
    setReady(true);
  })(); }, []);

  const setTheme = useCallback((t) => { setThemeState(t); storageSet("settings:theme", t); }, []);
  const navigate = (id) => { setView(id); setDrawerOpen(false); };
  const revealDeveloperProfile = () => {
    setDrawerOpen(false);
    runDeveloperRevealSequence((ctx) => {
      setRevealAudioCtx(() => ctx);

                <button

            {view === "notes" && <NotesView />}

        <div className="sae-seal-mark sae-display">SA</div>
        <div className="sae-display" style={{ fontWeight: 700, fontSize: 14 }}>Exam Master</div>
      </div>
      {ALL_NAV.map((item) => {
        const Icon = item.icon;
        return (
          <button key={item.id} className={`sae-nav-item${view === item.id ? " active" : ""}`} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: view === item.id ? undefined : "transparent", border: view === item.id ? undefined : "1px solid transparent", fontSize: 13.5, width: "100%", textAlign: "left" }} onClick={() => navigate(item.id)}>
            <Icon size={17} />{item.label}
            <ChevronRight size={14} style={{ marginLeft: "auto", opacity: 0.5 }} />
          </button>
        );
      })}
      <div className="sae-stamp" style={{ margin: "16px 10px 0", justifyContent: "center", display: hideThemeToggle ? "none" : "inline-flex" }}><Vote size={12} /> Civic Ledger v1</div>
    </div>
  );
}


try {
  const container = document.getElementById("root");
  const root = ReactDOM.createRoot(container);
  root.render(React.createElement(App));
} catch (err) {
  console.error(err);
}
</script>
</body>
</html>
